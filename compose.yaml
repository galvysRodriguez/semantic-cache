services:
  redis:
    # Redis 8 incluye el motor de consultas (búsqueda vectorial HNSW) de serie.
    image: docker.io/redis:8.2
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      SEMCACHE_REDIS_URL: redis://redis:6379/0
    # XAI_API_KEY (Grok) y demás ajustes; sin .env la app arranca con el LLM simulado.
    env_file:
      - path: .env
        required: false
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis-data:
